kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dummysite-controller-role
rules:
- apiGroups: ["apps"]
  # at the HTTP level, the name of the resource for accessing deployment
  # objects is "deployments" under "apps" api
  resources: ["deployments"]
  verbs: ["create"]
- apiGroups: [""]
  # at the HTTP level, the name of the resource for accessing service
  # objects is "services" under "" api
  resources: ["services"]
  verbs: ["create"]
- apiGroups: ["stable.dwk"]
  resources: ["dummysites"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["create"]