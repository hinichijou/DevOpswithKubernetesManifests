apiVersion: v1
kind: PersistentVolume
metadata:
  # Persistent volumes are cluster-wide resources and do not have a namespace.
  # namespace: exercises
  name: log-output-pv
spec:
  storageClassName: sc-log-output-pv # this is the name you are using later to claim this volume
  capacity:
    storage: 100Mi # Could be e.q. 500Gi. Small amount is to preserve space when testing locally
  volumeMode: Filesystem # This declares that it will be mounted into pods as a directory
  accessModes:
  - ReadWriteOnce
  local:
    path: /tmp/kube
  nodeAffinity: ## This is only required for local, it defines which nodes can access it
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3d-k3s-default-agent-0