apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  ## Server properties
  # Value for base href in index.html. Used if Argo CD is running behind reverse proxy under subpath different from / (default "/")
  server.basehref: "/argocd"
  # Used if Argo CD is running behind reverse proxy under subpath different from /
  server.rootpath: "/argocd"
  # If your security requirements allow it, the Argo CD API server can be run with TLS disabled. Allows http requests.
  server.insecure: "true"