name: Publish application

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
      tag:
        type: string
      ping_pong_image:
        type: string
      log_output_reader_image:
        type: string
      log_output_writer_image:
        type: string
      todo_frontend_image:
        type: string
      todo_backend_image:
        type: string
      wikipedia_job_image:
        type: string
      db_backup_job_image:
        type: string
      broadcaster_image:
        type: string


env:
  LOG_OUTPUT_PINGPONG_APP_KUSTOMIZATION_FOLDER: log_output_ping-pong_application
  # The return value is the one that is evaluated last
  TODO_KUSTOMIZATION_FOLDER: ${{ inputs.environment == 'production' && 'todo_app/overlays/prod' || 'todo_app/overlays/staging' }}

jobs:
  build-publish:
    name: Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Expects the shas of all of the images for a single app to be passed, otherwise not deployed
      - name: 'Are we deploying lpa'
        id: 'lpa_images'
        run: |
          echo "provided=${{
              inputs.ping_pong_image != '' &&
              inputs.log_output_writer_image != '' &&
              inputs.log_output_reader_image != ''
            }}" >> $GITHUB_OUTPUT

      - name: 'Are we deploying todo app'
        id: 'todo_images'
        run: |
          echo "provided=${{
              inputs.todo_frontend_image != '' &&
              inputs.todo_backend_image != '' &&
              inputs.wikipedia_job_image != '' &&
              inputs.db_backup_job_image != '' &&
              inputs.broadcaster_image != ''
            }}" >> $GITHUB_OUTPUT

      - name: Set up Kustomize
        if: steps.lpa_images.outputs.provided == 'true' || steps.todo_images.outputs.provided == 'true'
        uses: imranismail/setup-kustomize@v3

      - name : 'Set lpa images'
        if: steps.lpa_images.outputs.provided == 'true'
        shell: bash
        working-directory: "${{ env.LOG_OUTPUT_PINGPONG_APP_KUSTOMIZATION_FOLDER }}"
        run: |
          kustomize edit set image "${{ inputs.ping_pong_image }}"
          kustomize edit set image "${{ inputs.log_output_writer_image}}"
          kustomize edit set image "${{ inputs.log_output_reader_image}}"

      - name : 'Set todo images'
        if: steps.todo_images.outputs.provided == 'true'
        shell: bash
        working-directory: "${{ env.TODO_KUSTOMIZATION_FOLDER }}"
        run: |
          kustomize edit set image "${{ inputs.todo_frontend_image }}"
          kustomize edit set image "${{ inputs.todo_backend_image }}"
          kustomize edit set image "${{ inputs.wikipedia_job_image}}"
          kustomize edit set image "${{ inputs.db_backup_job_image}}"
          kustomize edit set image "${{ inputs.broadcaster_image}}"

      - name: Commit lpa kustomization.yaml to GitHub
        if: steps.lpa_images.outputs.provided == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: '${{ env.LOG_OUTPUT_PINGPONG_APP_KUSTOMIZATION_FOLDER }}/kustomization.yaml'
          message: New log output ping-pong application version released ${{ github.sha }}

      - name: Commit todo app kustomization.yaml to GitHub
        if: steps.todo_images.outputs.provided == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: '${{ env.TODO_KUSTOMIZATION_FOLDER }}/kustomization.yaml'
          message: New todo app ${{ inputs.environment }} version released ${{ github.sha }}
          # Pushes the detached head to main
          push: 'origin HEAD:main'
          # If I understood correctly this should be ok if tag is not provided, there won't be a tag with empty input
          tag: ${{ inputs.tag }}
          tag_push: '--force'